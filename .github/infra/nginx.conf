# nginx.conf — reverse proxy in front of Ollama.
# - Ollama stays bound to 127.0.0.1:11434 (Ollama has no built-in auth).
# - HTTPS terminates here (place your certs in /etc/nginx/ssl).
# - Every request must carry the shared API key in the Authorization header.
# - Dangerous model-management endpoints (pull/delete) are blocked.
# - Basic rate limiting to protect the GPU.

events {}

http {
  # Ollama upstream stays on loopback only.
  upstream ollama {
    server 127.0.0.1:11434;
    keepalive 32;
  }

  server {
    listen 443 ssl;

    # Generate with: openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
    #   -keyout /etc/nginx/ssl/ollama.key -out /etc/nginx/ssl/ollama.crt -subj "/CN=ollama"
    # (For a public host preferred by GitHub hosted runners, use Let's Encrypt instead.)
    ssl_certificate     /etc/nginx/ssl/ollama.crt;
    ssl_certificate_key /etc/nginx/ssl/ollama.key;

    # Limit connections from a single client.
    limit_req_zone $binary_remote_addr zone=alpha:10m rate=30r/m;

    # Whitelisted API paths the agent needs. Explicitly NOT proxied:
    # /api/pull, /api/delete, /api/push, /api/create.
    location ~ ^/api/(chat|generate|tags|embeddings)$ {
      limit_req zone=alpha burst=10 nodelay;

      # Header-based API key check (shared secret stored as a GitHub secret).
      if ($http_authorization != "Bearer ${OLLAMA_API_KEY}") {
        return 401 '{"error":"unauthorized"}';
      }

      proxy_pass http://ollama;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_read_timeout 600s;
    }

    location / {
      return 403 '{"error":"forbidden"}';
    }
  }
}
